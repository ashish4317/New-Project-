<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" role="img" aria-label="Illustration of a friendly dentist beside a healthy tooth">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eaf3ff"/><stop offset="1" stop-color="#d5f6f2"/></linearGradient>
    <linearGradient id="tooth" x1="0.2" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfe7fb"/></linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e6effa"/></linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1d6fe8"/><stop offset="1" stop-color="#12b8aa"/></linearGradient>
    <path id="toothP" d="M50 12C42 5 14 3 12 32c-1 18 10 26 12 48 2 20 6 34 14 34 8 0 8-22 12-22s4 22 12 22c8 0 12-14 14-34 2-22 13-30 12-48C86 3 58 5 50 12Z"/>
    <path id="spark" d="M12 0l2.6 9.4L24 12l-9.4 2.6L12 24l-2.6-9.4L0 12l9.4-2.6z"/>
  </defs>
  <rect width="600" height="680" fill="url(#bg)"/>
  <circle cx="470" cy="150" r="230" fill="#22d3c5" opacity=".14"/>
  <circle cx="90" cy="600" r="210" fill="#1d6fe8" opacity=".10"/>
  <circle cx="300" cy="330" r="190" fill="#ffffff" opacity=".45"/>

  <!-- big tooth -->
  <g transform="translate(335 95) rotate(8 120 140) scale(2.45)">
    <use href="#toothP" fill="#9cc9ef" transform="translate(4 5)"/>
    <use href="#toothP" fill="url(#tooth)" stroke="#12b8aa" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M24 26c4-9 13-11 20-7" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <path d="M20 44c-1 6 1 10 3 14" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".7"/>
  </g>

  <!-- dentist: coat -->
  <path d="M30 680C30 565 110 500 235 500S440 565 440 680Z" fill="url(#coat)" stroke="#c8dbf0" stroke-width="3"/>
  <path d="M185 503L235 600 285 503" fill="#1d6fe8"/>
  <path d="M185 503L150 520 220 622 235 600Z" fill="#ffffff" stroke="#c8dbf0" stroke-width="3" stroke-linejoin="round"/>
  <path d="M285 503L320 520 250 622 235 600Z" fill="#ffffff" stroke="#c8dbf0" stroke-width="3" stroke-linejoin="round"/>
  <rect x="318" y="610" width="64" height="44" rx="8" fill="#e7f6f4" stroke="#bfe6e1" stroke-width="2"/>
  <path d="M350 620v24M338 632h24" stroke="#0fa39a" stroke-width="5" stroke-linecap="round"/>
  <rect x="150" y="606" width="6" height="34" rx="3" fill="#12b8aa"/>
  <!-- stethoscope -->
  <path d="M168 512C150 560 160 610 200 622" fill="none" stroke="#33526f" stroke-width="5" stroke-linecap="round"/>
  <circle cx="205" cy="624" r="11" fill="#9db4cc" stroke="#33526f" stroke-width="4"/>
  <!-- neck + head -->
  <rect x="207" y="452" width="56" height="62" rx="22" fill="#eec19a"/>
  <ellipse cx="156" cy="392" rx="11" ry="17" fill="#f1c9a5"/><ellipse cx="314" cy="392" rx="11" ry="17" fill="#f1c9a5"/>
  <ellipse cx="235" cy="388" rx="80" ry="92" fill="#f7d3b2"/>
  <path d="M152 384C138 300 188 262 238 264c56 2 90 48 78 120-18-48-50-64-84-64-34 0-62 20-80 64z" fill="#1e3556"/>
  <path d="M190 330c18-10 44-12 66-4" fill="none" stroke="#2c4a75" stroke-width="5" stroke-linecap="round" opacity=".6"/>
  <!-- face -->
  <path d="M194 372q13-9 26-1M250 371q13-8 26 1" fill="none" stroke="#1e3556" stroke-width="5" stroke-linecap="round"/>
  <circle cx="207" cy="392" r="7" fill="#1e3556"/><circle cx="263" cy="392" r="7" fill="#1e3556"/>
  <circle cx="209" cy="389" r="2.3" fill="#fff"/><circle cx="265" cy="389" r="2.3" fill="#fff"/>
  <ellipse cx="190" cy="420" rx="14" ry="8" fill="#f4a8a0" opacity=".55"/><ellipse cx="280" cy="420" rx="14" ry="8" fill="#f4a8a0" opacity=".55"/>
  <path d="M200 426Q235 468 270 426Z" fill="#ffffff" stroke="#b4694a" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M212 435h46" stroke="#dbe6f1" stroke-width="2.5"/>
  <path d="M236 398v14" stroke="#e0a884" stroke-width="4" stroke-linecap="round"/>

  <!-- toothbrush -->
  <g transform="translate(398 548) rotate(-32)">
    <rect x="0" y="0" width="150" height="22" rx="11" fill="url(#handle)"/>
    <rect x="132" y="-8" width="54" height="26" rx="8" fill="#ffffff" stroke="#c8dbf0" stroke-width="2.5"/>
    <g stroke="#12b8aa" stroke-width="4" stroke-linecap="round"><path d="M142 -8v-12M152 -8v-12M162 -8v-12M172 -8v-12"/></g>
  </g>

  <!-- sparkles + bubbles -->
  <use href="#spark" transform="translate(520 80) scale(1.3)" fill="#12b8aa"/>
  <use href="#spark" transform="translate(80 150) scale(1)" fill="#1d6fe8" opacity=".7"/>
  <use href="#spark" transform="translate(500 470) scale(.8)" fill="#ffffff"/>
  <use href="#spark" transform="translate(60 330) scale(.7)" fill="#12b8aa" opacity=".8"/>
  <g fill="none" stroke="#1d6fe8" stroke-opacity=".35" stroke-width="3"><circle cx="110" cy="250" r="14"/><circle cx="560" cy="330" r="10"/><circle cx="470" cy="620" r="9"/></g>
</svg>
